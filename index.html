<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="汪晗的个人作品集页面，包含教育背景与实习经历。" />
  <title>汪晗 · Personal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --border: #E5E7EB;
      --border-light: #F3F4F6;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-tertiary: #9CA3AF;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      --accent-soft: #DBEAFE;
      --green: #059669;
      --green-light: #ECFDF5;
      --amber: #D97706;
      --amber-light: #FFFBEB;
      --rose: #E11D48;
      --rose-light: #FFF1F2;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .topbar {
      position: sticky; top:0; left:0; right:0;
      z-index: 100;
      display: flex; align-items:center; justify-content:space-between;
      padding: 16px 32px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .lang-toggle { display: flex; gap: 4px; }

    .lang-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 6px;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .lang-btn:hover:not(.active) {
      background: var(--border-light);
    }

    .main {
      position: relative;
      z-index: 1;
      padding: 0 24px 100px;
      max-width: 860px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 72px 20px 56px;
    }

    .hero-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
      background: var(--accent-light);
    }

    .hero-name {
      font-size: clamp(40px, 8vw, 56px);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }

    .hero-sub {
      color: var(--text-secondary);
      font-weight: 400;
      font-size: 17px;
      letter-spacing: -0.01em;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 56px 0 24px;
    }
    .section-label .txt {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      letter-spacing: -0.02em;
    }
    .section-label .rule {
      flex: 1;
      height: 0;
      border-top: 1px solid var(--border);
    }

    .edu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 640px) { .edu-grid { grid-template-columns: 1fr; } }

    .edu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: box-shadow 0.2s, transform 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .edu-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .edu-icon { width: 40px; height: 40px; color: var(--accent); margin-bottom: 14px; }
    .edu-degree { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.01em; }
    .edu-school { font-size: 14px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
    .edu-meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; font-weight: 500; }
    .edu-desc { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
    .edu-highlight { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 500; background: var(--green-light); color: var(--green); margin-top: 8px; margin-right: 6px; }

    .timeline { display: flex; flex-direction: column; }
    .tnode { display: flex; gap: 20px; }
    .tline-col { width: 40px; flex-shrink: 0; position: relative; }
    .tline-col::before {
      content:'';
      position: absolute;
      left: 50%; top: 28px; bottom: -34px;
      width: 2px;
      background: var(--border);
      transform: translateX(-50%);
    }
    .tnode.is-last .tline-col::before { display: none; }

    .tdot {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--surface);
      display: flex; align-items:center; justify-content:center;
      z-index: 2;
    }
    .tdot .dot-core { width: 10px; height: 10px; border-radius: 50%; }
    .tnode.tiktok .tdot .dot-core { background: var(--accent); }
    .tnode.tiktok .tdot { border-color: var(--accent); }
    .tnode.meituan .tdot .dot-core { background: var(--amber); }
    .tnode.meituan .tdot { border-color: var(--amber); }
    .tnode.xhs .tdot .dot-core { background: var(--rose); }
    .tnode.xhs .tdot { border-color: var(--rose); }

    .tcard-wrap { flex: 1; padding-bottom: 32px; }

    .tcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .tcard:hover { box-shadow: var(--shadow-md); }

    .tcard-head { padding: 20px 24px; display: flex; align-items: center; gap: 14px; }
    .tcard-icon { width: 38px; height: 38px; flex-shrink:0; }
    .tnode.tiktok .tcard-icon { color: var(--accent); }
    .tnode.meituan .tcard-icon { color: var(--amber); }
    .tnode.xhs .tcard-icon { color: var(--rose); }

    .tcard-headtext { flex: 1; min-width: 0; }
    .tcard-company { font-size: 18px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
    .tnode.tiktok .tcard-company { color: var(--accent); }
    .tnode.meituan .tcard-company { color: var(--amber); }
    .tnode.xhs .tcard-company { color: var(--rose); }
    .tcard-role { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

    .tcard-date {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      white-space: nowrap;
      background: var(--border-light);
      padding: 5px 12px;
      border-radius: 6px;
    }

    .tcard-now { display:inline-block; margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-light); padding: 2px 8px; border-radius: 4px; }
    .tcard-chev { width: 18px; height: 18px; color: var(--text-tertiary); flex-shrink:0; transition: transform 0.3s ease; }
    .tcard.open .tcard-chev { transform: rotate(180deg); }

    .tcard-body { max-height: 0; overflow: hidden; transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1); }
    .tcard.open .tcard-body { border-top: 1px solid var(--border); }
    .tcard-body-inner { padding: 24px; }

    .project-block { margin-bottom: 24px; }
    .project-block:last-child { margin-bottom: 0; }
    .project-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 14px; letter-spacing: -0.01em; }

    .task-block { margin-bottom: 14px; padding-left: 14px; border-left: 3px solid var(--border); }
    .task-name { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
    .task-desc { font-size: 13px; line-height: 1.75; color: var(--text-secondary); }

    .metrics-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .metric-chip {
      display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 6px;
      font-size: 12px; font-weight: 600;
      border: 1px solid;
    }
    .tnode.tiktok .metric-chip { background: var(--accent-light); border-color: var(--accent-soft); color: var(--accent); }
    .tnode.meituan .metric-chip { background: var(--amber-light); border-color: #FDE68A; color: var(--amber); }
    .tnode.xhs .metric-chip { background: var(--rose-light); border-color: #FECDD3; color: var(--rose); }

    .skills-footer { padding: 18px 24px; display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--border); }
    .skill-tag { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--border-light); color: var(--text-secondary); }

    .future-note { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding-left: 40px; }
    .future-note svg { width: 24px; height: 24px; color: var(--text-tertiary); }
    .future-note span { font-size: 15px; color: var(--text-secondary); font-weight: 500; }

    .info-hint { text-align: center; margin-top: 56px; font-size: 14px; color: var(--text-tertiary); }

    @media (max-width: 640px) {
      .tcard-company { font-size: 16px; }
      .hero-name { font-size: 36px; }
      .tline-col { width: 32px; }
      .tnode { gap: 14px; }
      .topbar { padding: 14px 20px; }
      .main { padding: 0 16px 80px; }
    }
  </style>
</head>

    function setLang(l) {
      lang = l;
      document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
      document.getElementById('btnZh').classList.toggle('active', l === 'zh');
      document.getElementById('btnEn').classList.toggle('active', l === 'en');
      const t = i18n[l];
      document.getElementById('hero-tag').textContent = t.heroTag;
      document.getElementById('hero-name').textContent = t.heroName;
      document.getElementById('hero-sub').textContent = t.heroSub;
      document.getElementById('eduLabel').textContent = t.eduLabel;
      document.getElementById('workLabel').textContent = t.workLabel;
      document.getElementById('futureNote').textContent = t.futureNote;
      document.getElementById('infoHint').textContent = t.infoHint;
      renderEdu();
      renderTimeline();
    }

    function renderEdu() {
      const grid = document.getElementById('eduGrid');
      const order = ['bachelor', 'master'];
      grid.innerHTML = order.map(k => {
        const d = eduData[k][lang];
        const highlightsHTML = d.highlights.length > 0 ? '<div style="margin-top:12px">' + d.highlights.map(h => `<div class="edu-highlight">🏆 ${h}</div>`).join('') + '</div>' : '';
        return `
          <article class="edu-card">
            <div class="edu-icon">${icons[k]}</div>
            <div class="edu-degree">${d.degree}</div>
            <div class="edu-school">${d.school}</div>
            <div class="edu-meta">${d.meta}</div>
            <p class="edu-desc">${d.desc}</p>
            ${highlightsHTML}
          </article>
        `;
      }).join('');
    }

    function renderTimeline() {
      const wrap = document.getElementById('timeline');
      wrap.innerHTML = data.map((item, i) => {
        const d = item[lang];
        const isLast = i === data.length - 1;
        const projectsHTML = d.projects.map(proj => {
          const blocksHTML = proj.blocks.map(b => `
            <div class="task-block">
              <div class="task-name">${b.name}</div>
              <p class="task-desc">${b.desc}</p>
            </div>
          `).join('');
          const metricsHTML = proj.metrics.map(m => `<span class="metric-chip">${m}</span>`).join('');
          return `
            <div class="project-block">
              <div class="project-title">${proj.title}</div>
              ${blocksHTML}
              <div class="metrics-row">${metricsHTML}</div>
            </div>
          `;
        }).join('');
        const skillsHTML = d.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
        const nowTag = d.now ? `<span class="tcard-now">${i18n[lang].nowTag}</span>` : '';

        return `
          <div class="tnode ${item.key} ${isLast ? 'is-last' : ''}">
            <div class="tline-col"><div class="tdot"><span class="dot-core"></span></div></div>
            <div class="tcard-wrap">
              <article class="tcard" id="card-${item.key}" onclick="toggleCard('${item.key}')">
                <div class="tcard-head">
                  <div class="tcard-icon">${icons[item.icon]}</div>
                  <div class="tcard-headtext">
                    <div class="tcard-company">${d.company}${nowTag}</div>
                    <div class="tcard-role">${d.role}</div>
                  </div>
                  <div class="tcard-date">${d.date}</div>
                  <svg class="tcard-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                <div class="tcard-body">
                  <div class="tcard-body-inner">
                    ${projectsHTML}
                  </div>
                  <div class="skills-footer">${skillsHTML}</div>
                </div>
              </article>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCard(key) {
      const card = document.getElementById('card-' + key);
      const body = card.querySelector('.tcard-body');
      const isOpen = card.classList.contains('open');
      if (isOpen) {
        body.style.maxHeight = null;
        card.classList.remove('open');
      } else {
        card.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 'px';
      }
    }

    setLang('zh');
  </script>
